<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <!-- Pinch-zoom is deliberately LEFT ENABLED (no maximum-scale / user-scalable=no): blocking it
         fails WCAG 1.4.4, and low-vision players need it to read a board of small tubes. The reason
         it used to be blocked — double-tap-to-zoom firing during rapid tapping — is handled properly
         in CSS instead, via `touch-action: manipulation` on the things you tap (see tokens.css). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2a1a4a" />
    <title>Magic Color</title>

    <!-- iOS "Add to Home Screen": these drive the icon, title, and standalone chrome,
         since iOS ignores the web app manifest for those. -->
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- translucent: the page's gradient fills behind the status bar so it blends in -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Magic Color" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
